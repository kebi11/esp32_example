<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32-S3 GNSS Terminal</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
    <header>
        <h1>ESP32-S3 GNSS Terminal</h1>
        <span id="conn-state" class="badge">连接中...</span>
    </header>

    <section class="card">
        <h2>设备状态</h2>
        <table>
            <tbody>
                <tr><th>设备名</th><td id="device">--</td></tr>
                <tr><th>IP</th><td id="ip">--</td></tr>
                <tr><th>Wi-Fi RSSI</th><td id="rssi">--</td></tr>
                <tr><th>运行时间</th><td id="uptime">--</td></tr>
                <tr><th>剩余内存</th><td id="heap">--</td></tr>
            </tbody>
        </table>
    </section>

    <section class="card">
        <h2>GNSS</h2>
        <table>
            <tbody>
                <tr><th>定位状态</th><td id="fix">--</td></tr>
                <tr><th>卫星数量</th><td id="satellites">--</td></tr>
                <tr><th>纬度</th><td id="lat">--</td></tr>
                <tr><th>经度</th><td id="lon">--</td></tr>
                <tr><th>海拔</th><td id="alt">--</td></tr>
                <tr><th>速度</th><td id="speed">--</td></tr>
                <tr><th>UTC</th><td id="utc">--</td></tr>
            </tbody>
        </table>
    </section>

    <section class="card">
        <h2>地图</h2>
        <div id="map"></div>
        <p id="map-hint" class="hint">定位后显示当前位置与轨迹（需联网加载地图）。</p>
    </section>

    <section class="card" id="wifi-config" hidden>
        <h2>Wi-Fi 设置</h2>
        <p class="hint">当前未连接网络，输入 Wi-Fi 名称和密码保存后自动连接。</p>
        <div class="form-row">
            <input id="ssid" type="text" placeholder="Wi-Fi 名称 (SSID)" autocomplete="off">
            <input id="password" type="password" placeholder="密码">
            <button id="save-wifi" onclick="saveWifi()">保存并连接</button>
        </div>
        <div id="wifi-msg" class="hint"></div>
    </section>

    <footer>SSE 实时推送</footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
